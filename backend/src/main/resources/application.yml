spring:
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 12h
  application:
    name: personal-hub-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/personal_hub}
    username: ${SPRING_DATASOURCE_USERNAME:personal_hub}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-in-production}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  auth:
    username: ${PERSONAL_HUB_USERNAME:personal}
    password-hash: ${PERSONAL_HUB_PASSWORD_HASH:}
