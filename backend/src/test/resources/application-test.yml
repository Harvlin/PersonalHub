spring:
  application:
    name: personal-hub-api
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 12h
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null

server:
  port: 0
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors-origins: http://localhost:5173
  auth:
    username: personal
    password-hash: