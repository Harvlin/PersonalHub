services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_hub}
      POSTGRES_USER: ${POSTGRES_USER:-personal_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "5432:5432"
    volumes:
      - personal_hub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-personal_hub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-personal_hub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      PERSONAL_HUB_USERNAME: ${PERSONAL_HUB_USERNAME:-personal}
      PERSONAL_HUB_PASSWORD_HASH: ${PERSONAL_HUB_PASSWORD_HASH:-$$2y$$05$$GMzhLBNpBjDR7XU6j6rBn.E1oxUvDGOhBghKdld0.55yqX/E7o2pm}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  personal_hub_data:
